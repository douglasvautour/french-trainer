<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apprenez le français !</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Français">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap">
<style>
@font-face { font-family: 'Montserrat Local'; src: url(fonts/montserrat-400.woff) format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Montserrat Local'; src: url(fonts/montserrat-600.woff) format('woff'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Crimson Local'; src: url(fonts/crimson-400.woff) format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Crimson Local'; src: url(fonts/crimson-700.woff) format('woff'); font-weight: 700; font-display: swap; }

:root {
  --ink: #2f2f31;
  --ink-2: #5d5d62;
  --muted: #8d8d93;
  --line: #e7e5e1;
  --soft: #f6f5f2;
  --accent: #23468c;      /* bleu de France, used sparingly */
  --accent-soft: #eef2fa;
  --good: #2f7a4f;
  --good-soft: #eaf5ee;
  --bad: #b2362b;
  --bad-soft: #fbeceb;
  --warn: #9a6b12;
  --star: #c79a2b;
  --serif: 'EB Garamond', 'Crimson Local', Garamond, 'Times New Roman', serif;
  --sans: 'Montserrat', 'Montserrat Local', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px);
  --sr: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #fff; color: var(--ink); }
body { font-family: var(--sans); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.muted { color: var(--muted); }
.dot { margin: 0 .45em; color: var(--line); }
#app { max-width: 640px; margin: 0 auto; }

/* ---------- Screens ---------- */
.screen { min-height: 100vh; min-height: 100dvh; padding: var(--st) var(--sr) 0 var(--sl); }
.quiz { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 56px; padding: 0 8px; position: sticky; top: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 5; }
.page .bar { border-bottom: 1px solid var(--line); top: var(--st); }
.bar-title { font-family: var(--serif); font-weight: 700; font-size: 20px; letter-spacing: .01em; text-align: center; white-space: nowrap; }
.quiz .bar { grid-template-columns: auto 1fr auto; }
.quiz .bar-title { text-align: left; font-size: 19px; padding-left: 2px; }
.page-h1 { font-family: var(--serif); font-weight: 700; font-size: 34px; margin: 18px 0 0; line-height: 1.1; }
.bar-right { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
.icon { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 22px; color: var(--ink); transition: background .15s, color .15s; }
.icon:active { background: var(--soft); }
.icon:disabled { opacity: .3; }
.icon.star.on { color: var(--star); }
.icon.star.on svg { fill: var(--star); }
.icon.round { width: 40px; height: 40px; border: 1px solid var(--line); font-size: 22px; line-height: 1; }

.pbar { height: 2px; background: var(--line); margin: 0 20px; }
.pbar div { height: 100%; background: var(--accent); width: 0; transition: width .35s ease; }

/* ---------- Home ---------- */
.home { padding: calc(var(--st) + 56px) calc(var(--sr) + 24px) 40px calc(var(--sl) + 24px); }
.home-head { margin-bottom: 36px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.home h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(38px, 11vw, 54px); line-height: 1.02; margin: 0; letter-spacing: -.01em; }
.rule { width: 44px; height: 2px; background: var(--accent); margin-top: 22px; }
.modules { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.modules li { border-bottom: 1px solid var(--line); }
.module { display: flex; align-items: center; gap: 16px; width: 100%; padding: 20px 4px; text-align: left; }
.module:active { background: var(--soft); }
.m-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.m-text { flex: 1; display: flex; flex-direction: column; }
.m-title { font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.15; }
.m-sub { font-size: 13px; color: var(--muted); }
.m-chev { color: var(--muted); display: grid; }

/* ---------- Quiz ---------- */
.q-area { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 12px 24px 18px; border-bottom: 1px solid var(--line); }
.a-area { flex: 2 1 0; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 calc(var(--sb) + 16px); }
.a-inner { padding: 24px 20px 8px; display: flex; flex-direction: column; gap: 14px; }
.q-meta { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.q-meta .dot { margin: 0 .5em; }
.q-tense { font-family: var(--serif); font-weight: 400; font-size: clamp(18px, 5.1vw, 22px); line-height: 1.1; margin: 0 0 8px; }
.q-rule { width: 40px; height: 1px; background: var(--ink); margin: 0 0 14px; }
.q-text { font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 8.4vw, 40px); line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.q-text.small { font-size: 28px; }
.q-hint { margin: 12px 0 0; font-size: 14px; color: var(--ink-2); }
.q-hint .how { display: inline-flex; align-items: center; gap: 5px; vertical-align: bottom; margin-left: 14px; }
.q-hint .sep { margin: 0 .55em; color: var(--muted); }
.q-hint .how svg { width: 18px; height: 18px; }
.q-scaffold { font-family: var(--serif); font-weight: 600; font-size: clamp(19px, 5.4vw, 24px); color: var(--ink-2); margin: 10px 0 0; line-height: 1.25; }
.q-hint .cue { color: var(--ink); }
.q-hint .ptag { font-size: .66em; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-right: .4em; }
.q-hint .ptag.solo { margin-right: 0; }
.q-hint .cue { white-space: nowrap; }
.group-note { font-size: 12.5px; margin: 4px 0 0; }
.q-empty .muted { margin-top: 10px; }
.blank { display: inline-block; min-width: 3.4em; border-bottom: 2px solid var(--ink); line-height: 1; padding: 0 .1em; vertical-align: baseline; height: 1em; }
.blank.filled { min-width: 0; height: auto; border-bottom-width: 2px; }
.blank.good { color: var(--good); border-color: var(--good); }
.blank.bad { color: var(--ink); border-color: var(--bad); }

.field input { width: 100%; font-family: var(--serif); font-weight: 600; font-size: 24px; color: var(--ink); padding: 14px 16px; border: 1px solid #d6d4cf; border-radius: 12px; background: #fff; outline: none; -webkit-appearance: none; appearance: none; transition: border-color .15s, box-shadow .15s; }
.field input::placeholder { font-family: var(--sans); font-weight: 400; font-size: 16px; color: #a9a9ae; }
.field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field input.good { border-color: var(--good); background: var(--good-soft); color: var(--good); box-shadow: none; }
.field input.revealed { border-color: var(--bad); background: var(--bad-soft); color: var(--ink); box-shadow: none; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.accents { display: flex; flex-wrap: wrap; gap: 6px; }
.accents.off { display: none; }
.key { min-width: 38px; height: 38px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.key:active { background: var(--line); }

.msg { min-height: 24px; display: flex; flex-direction: column; gap: 2px; }
.msg-main { font-weight: 600; font-size: 16px; }
.msg-sub { font-size: 13px; color: var(--muted); }
.msg.good .msg-main { color: var(--good); }
.msg.bad .msg-main { color: var(--bad); }
.msg.warn .msg-main { color: var(--warn); }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 14px; border: 1px solid #d6d4cf; font-weight: 600; font-size: 16px; letter-spacing: .02em; transition: background .15s, transform .05s; }
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); width: 100%; }
.btn.primary.next { background: var(--accent); border-color: var(--accent); }
.btn.hidden { visibility: hidden; }
.btn.danger { color: var(--bad); border-color: #e9c2be; }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }

.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 10px 16px 10px 12px; border: 1px solid #dcdad5; border-radius: 14px; text-align: left; font-family: var(--serif); font-weight: 600; font-size: 22px; line-height: 1.2; transition: background .15s, border-color .15s; }
.opt:not(:disabled):active { background: var(--soft); }
.opt .mark { width: 26px; height: 26px; flex: none; display: grid; place-items: center; }
.opt .mark svg { width: 22px; height: 22px; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .mark { color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .mark { color: var(--bad); }
.opt:disabled:not(.right):not(.wrong) { color: var(--muted); }

.summary .row, .modal .row { display: flex; gap: 10px; }
.summary .row .btn { flex: 1; width: auto; }
.results { list-style: none; margin: 0; padding: 0; }
.results li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.results .mark { width: 22px; flex: none; padding-top: 3px; }
.results .mark svg { width: 18px; height: 18px; }
.results li.good .mark { color: var(--good); }
.results li.bad .mark { color: var(--bad); }
.r-text { display: flex; flex-direction: column; font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; }
.r-text small { font-family: var(--sans); font-weight: 400; font-size: 12px; color: var(--muted); }

/* ---------- Pages (settings / progress) ---------- */
.content { padding: 8px calc(var(--sr) + 20px) calc(var(--sb) + 40px) calc(var(--sl) + 20px); }
.group { padding: 22px 0 24px; border-bottom: 1px solid var(--line); }
.group:last-of-type { border-bottom: 0; }
.group h2 { font-family: var(--serif); font-weight: 700; font-size: 26px; margin: 0 0 6px; line-height: 1.2; }
.group h3 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 22px 0 6px; }
.group h2 + h3 { margin-top: 12px; }
.stepper { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.stepper output { font-family: var(--serif); font-weight: 700; font-size: 30px; min-width: 44px; text-align: center; }
.stepper .muted { font-size: 14px; }

.checks.two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
.check { display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 6px 0; cursor: pointer; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box { width: 24px; height: 24px; flex: none; border: 1.5px solid #bdbbb6; border-radius: 7px; display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.check .box svg { width: 16px; height: 16px; }
.check input:checked + .box { background: var(--ink); border-color: var(--ink); color: #fff; }
.check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }
.check .lbl { display: flex; flex-direction: column; font-size: 16px; }
.check .lbl small { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.warn-note { display: none; margin: 4px 0 0; font-size: 13px; color: var(--bad); }
.warn-note.show { display: block; }

.source { border-bottom: 1px solid var(--line); }
.source:last-child { border-bottom: 0; }
.source-row { display: flex; align-items: center; gap: 8px; }
.source-row .check { flex: 1; }
.disclose { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 4px 0 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.disclose .chev { display: grid; transition: transform .2s; }
.disclose .chev svg { width: 18px; height: 18px; }
.source.open .disclose .chev { transform: rotate(90deg); }
.panel:empty { display: none; }
.panel { padding: 0 0 16px 38px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; background: var(--soft); font-size: 14px; }
.chip-star { display: grid; color: var(--star); }
.chip-star svg { width: 13px; height: 13px; fill: var(--star); }
.chip.removable { padding-right: 4px; }
.chip.removable button { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 13px; color: var(--muted); }
.chip.removable button svg { width: 14px; height: 14px; }
.empty { margin: 0; font-size: 14px; color: var(--muted); }
.forms { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
.forms li { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.forms li:last-child { border-bottom: 0; }
.forms .f { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.2; }
.forms .meta { grid-column: 1; font-size: 12px; color: var(--muted); }
.forms .streak, .forms .bar { grid-column: 2; grid-row: 1 / span 2; }
.streak { display: inline-flex; gap: 4px; }
.streak i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.streak i.on { background: var(--accent); }
.forms .bar { width: 64px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.forms .bar i { display: block; height: 100%; background: var(--accent); }
.danger-zone p { font-size: 14px; margin: 0 0 16px; }
.foot { font-size: 12px; text-align: center; margin-top: 18px; }
.credits { margin-top: 6px; }
.credits a { color: inherit; }

.seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); }
.seg button { padding: 6px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-selected="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.range-note { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; margin: 18px 0 10px; }
.tiles { display: grid; gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
.t-num { font-family: var(--serif); font-weight: 700; font-size: 56px; line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.t-label { font-weight: 600; margin-top: 8px; }
.t-note { font-size: 13px; color: var(--muted); }
.tile { display: block; width: 100%; text-align: left; background: none; font: inherit; color: inherit; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.tile:active { background: var(--soft); }
.t-chev { position: absolute; right: 14px; top: 18px; color: var(--muted); }
.t-chev svg { width: 18px; height: 18px; }
.chart { margin-top: 30px; }
.chart-h { font-family: var(--serif); font-weight: 700; font-size: 24px; margin: 0 0 6px; line-height: 1.2; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-svg .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 3; }
.chart-svg .base { stroke: var(--ink-2); stroke-width: 1; }
.chart-svg .ax { font-family: var(--sans); font-size: 9.5px; fill: var(--muted); }
.chart-svg .xl { fill: var(--ink-2); }
.chart-svg .val { font-family: var(--sans); font-size: 9.5px; font-weight: 600; fill: var(--ink-2); }
.chart-svg .hit { fill: transparent; cursor: pointer; }
.chart-svg .bar { transition: opacity .15s; }
.chart-svg .bar.dim { opacity: .35; }
.chart-cap { font-size: 13px; min-height: 1.4em; margin: 6px 0 0; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(3, 1fr); } .t-num { font-size: 48px; } }


/* ---------- Backup ---------- */
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.row-btns .btn { flex: 1; min-width: 140px; padding: 0 10px; white-space: nowrap; }
.foot-note { font-size: 13px; margin: 10px 0 0; }
.group > p.muted { font-size: 14px; margin: 0 0 16px; }

/* ---------- Verb list pages ---------- */
.text-btn { min-height: 44px; padding: 0 10px; font-family: var(--serif); font-weight: 700; font-size: 19px; color: var(--ink); }
.back-text { width: auto; padding: 0 10px 0 2px; gap: 2px; display: inline-flex; color: var(--ink); font-family: var(--serif); font-size: 19px; font-weight: 700; white-space: nowrap; }
.back-text svg { margin-right: -2px; }
.list-page .bar-title { overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
.list-tools { position: sticky; top: calc(var(--st) + 56px); z-index: 4; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 12px calc(var(--sr) + 20px) 8px calc(var(--sl) + 20px); border-bottom: 1px solid var(--line); }
.search input { width: 100%; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--soft); outline: none; -webkit-appearance: none; appearance: none; }
.search input:focus { border-color: var(--accent); background: #fff; }
.seg.small { margin-top: 10px; display: flex; }
.seg.small button { flex: 1; }
.list-count { font-size: 12.5px; margin: 8px 0 0; }
.swipe-list { list-style: none; margin: 0; padding: 0 0 calc(var(--sb) + 40px); }
.sw { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); touch-action: pan-y; transition: height .25s ease, opacity .25s; background: var(--bad); }
.sw.removing { opacity: 0; }
.sw-act { position: absolute; top: 0; right: 0; bottom: 0; width: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 18px; background: var(--bad); color: #fff; font-weight: 600; font-size: 15px; }
.sw-act.restore, .restoring .sw { background: var(--accent); }
.sw-main { position: relative; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px calc(var(--sr) + 20px) 10px calc(var(--sl) + 20px); background: #fff; transition: transform .25s ease; user-select: none; -webkit-user-select: none; }
.sw-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sw-text .f { font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.2; display: inline-flex; align-items: center; gap: 6px; }
.sw-text .meta { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-main .bar { width: 64px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; flex: none; }
.sw-main .bar i { display: block; height: 100%; background: var(--accent); }
.sw-inline { display: none; flex: none; padding: 7px 12px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 13px; }
.sw-inline.restore { background: var(--accent-soft); color: var(--accent); }
.editing .sw-inline { display: inline-block; }
.list-empty { padding: 28px 20px; text-align: center; }
.sentinel { height: 1px; }
#toast.has-action { width: max-content; max-width: 92vw; text-align: left; display: flex; align-items: center; gap: 14px; pointer-events: auto; padding: 8px 8px 8px 18px; }
#toast .undo { color: #9fc0ff; font-weight: 600; padding: 6px 10px; }


/* ---------- Verb page ---------- */
.row-chev { display: grid; color: #c4c2bd; flex: none; }
.row-chev svg { width: 18px; height: 18px; }
.editing .row-chev { display: none; }
.sw-main { cursor: pointer; }
.verb-title { font-family: var(--serif); font-weight: 700; font-size: 38px; line-height: 1.1; margin: 22px 0 4px; }
.verb-sub { font-size: 14px; color: var(--ink-2); margin: 0 0 6px; }
.verb-legend { font-size: 12px; color: var(--muted); margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.ldot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-left: 6px; vertical-align: middle; flex: none; }
.verb-legend .ldot, .verb-legend .rdot { margin: 0 6px 0 0; }
.verb-legend span { display: inline-flex; align-items: center; margin-right: 16px; }
.rdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #d9a441; margin-left: 6px; vertical-align: middle; flex: none; }
.vt { padding: 18px 0 6px; }
.vt h2 { font-family: var(--serif); font-weight: 400; font-size: 22px; line-height: 1.1; margin: 0 0 8px; }
.vt .q-rule { margin-bottom: 12px; }
.vgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; row-gap: 6px; }
.vf { font-family: var(--serif); font-weight: 600; font-size: 18px; line-height: 1.25; }
.vf .pr { font-weight: 400; color: var(--ink-2); }
.vf .alt { font-weight: 400; font-size: 14px; color: var(--muted); }
.vf.missing { color: var(--muted); }
@media (max-width: 360px) { .vgrid { grid-template-columns: 1fr; } }


/* ---------- Grammar guide ---------- */
.gd-jump { display: flex; gap: 10px; margin: 16px 0 4px; }
.gd-jump a { font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; }
.gd-h { font-family: var(--serif); font-weight: 700; font-size: 32px; margin: 26px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.gd { padding: 18px 0 14px; border-bottom: 1px solid var(--line); }
.gd:last-child { border-bottom: 0; }
.gd h3 { font-family: var(--serif); font-weight: 400; font-size: 24px; line-height: 1.15; margin: 0 0 8px; }
.gd .q-rule { margin-bottom: 12px; }
.gd p { font-size: 15px; line-height: 1.55; margin: 0 0 10px; color: var(--ink); }
.gd .gd-list { font-family: var(--serif); font-weight: 600; font-size: 18px; color: var(--ink-2); }
.gd .gd-form { color: var(--ink-2); }
.gd .gd-form strong { color: var(--ink); font-weight: 600; }
.gd-ex { list-style: none; margin: 4px 0 0; padding: 0; }
.gd-ex li { display: flex; flex-direction: column; padding: 8px 0 8px 14px; border-left: 2px solid var(--line); margin-bottom: 8px; }
.gd-ex .fr { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.25; }
.gd-ex .en { font-size: 13.5px; color: var(--muted); }

/* ---------- Modal & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(30,30,32,.35); display: grid; place-items: center; padding: 24px; z-index: 20; opacity: 0; transition: opacity .2s; }
.modal-back.show { opacity: 1; }
.modal { background: #fff; border-radius: 18px; padding: 24px 22px 18px; max-width: 360px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.18); transform: translateY(8px); transition: transform .2s; }
.modal-back.show .modal { transform: none; }
.modal h3 { font-family: var(--serif); font-weight: 700; font-size: 24px; margin: 0 0 8px; }
.modal p { margin: 0 0 20px; font-size: 15px; color: var(--ink-2); }
.modal .row .btn { flex: 1; padding: 0 12px; }
#toast { position: fixed; left: 50%; bottom: calc(var(--sb) + 24px); transform: translate(-50%, 20px); background: var(--ink); color: #fff; font-size: 14px; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
